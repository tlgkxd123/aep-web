[project]
name = "pmatch"
version = "0.1.0"
description = "Particle Match world model for aep-web, in PyTorch"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "torch==2.11.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pmatch"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
