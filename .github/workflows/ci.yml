# The gates a GitHub runner can run. The After Effects and GPU gates (G2/G3, G6-G8, the pixel suites)
# need aerender and this project's reference machine, so they stay local.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: G1 types
        run: npx tsc --noEmit
      - name: Tests
        run: npx vitest run
      - name: G5 build
        run: npx vite build
